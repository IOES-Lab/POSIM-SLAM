name: Library integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  independent-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=68' wheel
      - run: python -m pip install -e '.[research]'
      - run: python -m unittest discover -s tests
      - run: python tools/evaluate_inertial_filter.py --output "$RUNNER_TEMP/inertial-filter.json"
      - run: python -m unittest discover -s native/basalt -p 'test_*.py'
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests"
