name: Library integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y libeigen3-dev nlohmann-json3-dev
      - run: python -m pip install -e .
      - name: Compile grouped Ping elimination probe
        run: >-
          c++ -std=c++17 -O2 -DEIGEN_MPL2_ONLY -DEIGEN_DONT_PARALLELIZE
          -I/usr/include/eigen3 native/basalt/ping_joint_probe.cc
          -o "$RUNNER_TEMP/ping_joint_probe"
      - name: Compare native and reference solutions
        run: POSIM_SLAM_PING_PROBE="$RUNNER_TEMP/ping_joint_probe" python native/basalt/test_ping_joint_native.py
      - name: Check joint map covariance against dense and coordinate controls
        run: |
          c++ -std=c++17 -O2 -DEIGEN_MPL2_ONLY -DEIGEN_DONT_PARALLELIZE \
            -I/usr/include/eigen3 native/basalt/map_information_probe.cc \
            -o "$RUNNER_TEMP/map_information_probe"
          "$RUNNER_TEMP/map_information_probe"
      - name: Compare native finite-cone and sonar-fan joint surface ranges
        run: |
          c++ -std=c++17 -O2 -DEIGEN_MPL2_ONLY -DEIGEN_DONT_PARALLELIZE \
            -I/usr/include/eigen3 native/basalt/range_surface_probe.cc \
            -o "$RUNNER_TEMP/range_surface_probe"
          POSIM_SLAM_RANGE_SURFACE_PROBE="$RUNNER_TEMP/range_surface_probe" \
            python native/basalt/test_range_surface_native.py
      - name: Compare persistent joint surface priors and original-reading ownership
        run: |
          c++ -std=c++17 -O2 -DEIGEN_MPL2_ONLY -DEIGEN_DONT_PARALLELIZE \
            -I/usr/include/eigen3 native/basalt/surface_prior_probe.cc \
            -o "$RUNNER_TEMP/surface_prior_probe"
          POSIM_SLAM_SURFACE_PRIOR_PROBE="$RUNNER_TEMP/surface_prior_probe" \
            python native/basalt/test_surface_prior_native.py
  independent-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=68' wheel
      - run: python -m pip install -e '.[research,diagnostics]'
      - run: python -m unittest discover -s tests
      - run: python tools/evaluate_inertial_filter.py --output "$RUNNER_TEMP/inertial-filter.json"
      - run: python tools/evaluate_stationary_initialization.py --output "$RUNNER_TEMP/inertial-initialization.json"
      - run: python tools/evaluate_moving_initialization.py --output "$RUNNER_TEMP/moving-initialization.json"
      - run: python -m unittest discover -s native/basalt -p 'test_*.py'
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests"
